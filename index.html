<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>We've moved to mercial.uk</title>
  <meta name="description" content="The Warwick AI Safety Initiative is now Mercial. Visit mercial.uk.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://mercial.uk/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e9eef2;
      --ink: #15263a;
      --muted: #5d6f82;
      --rule: #c3ced8;
      --link: #1f5f9e;
      --focus: #e0a526;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101a25;
        --ink: #e3ebf2;
        --muted: #8c9cad;
        --rule: #2a3a4b;
        --link: #8cc0f0;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 1.125rem;
      line-height: 1.55;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
    }

    main {
      width: 100%;
      max-width: 36rem;
    }

    .old {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 500;
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .new {
      margin: 0.1em 0 0;
      font-size: clamp(2.75rem, 11vw, 4.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .new a {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--link);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.12em;
    }

    .new a:hover { color: var(--link); }

    p {
      margin: 1.5rem 0 0;
      max-width: 34em;
    }

    .aside {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
      font-size: 1rem;
      color: var(--muted);
    }

    a { color: var(--link); }

    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <main>
    <p class="old" aria-hidden="true">waisi.uk</p>
    <h1 class="new"><a href="https://mercial.uk/">mercial.uk</a></h1>

    <p>This site is no longer active. The Warwick AI Safety Initiative is now <a href="https://mercial.uk/">Mercial</a>, and you'll find our programmes, events and updates at <a href="https://mercial.uk/">mercial.uk</a>.</p>

    <p class="aside">Looking for the Wisconsin AI Safety Initiative? Their site is <a href="https://waisi.org/">waisi.org</a>.</p>
  </main>
</body>
</html>
